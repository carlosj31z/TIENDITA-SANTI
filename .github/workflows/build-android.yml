name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "manifest.json"
      - "sw.js"
      - "icons/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (www/)
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk giannexpress.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: giannexpress-apk
          path: giannexpress.apk

      - name: Publish/update "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "GIANNEXPRESS · Android (última versión)"
          body: |
            APK de descarga directa para Android, generado automáticamente
            desde la rama `main`. No requiere Play Store.

            Instalación: descarga el archivo `giannexpress.apk`, ábrelo en el
            celular y permite "instalar apps de origen desconocido" si
            Android lo pide.
          prerelease: false
          make_latest: false
          files: giannexpress.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
