name: Build "Mañana Te Pago" APK

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "js/supabaseClient.js"
      - "admin-app/**"
      - "scripts/build-www-admin.js"
      - ".github/workflows/build-admin-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies (Capacitor CLI/core)
        run: npm ci

      - name: Install admin-app dependencies
        working-directory: admin-app
        run: npm ci

      - name: Regenerar el ícono si hay una imagen de marca
        run: |
          SRC=$(ls brand/app-icon-source.* 2>/dev/null | head -1 || true)
          if [ -n "$SRC" ]; then
            echo "Usando $SRC como ícono de la app."
            python3 -m pip install --quiet --disable-pip-version-check pillow
            python3 scripts/make-app-icons.py "$SRC"
          else
            echo "Sin brand/app-icon-source.*: se usa el ícono ilustrado versionado."
          fi

      - name: Build admin web assets (admin-app/www/)
        working-directory: admin-app
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: admin-app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: admin-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp admin-app/android/app/build/outputs/apk/debug/app-debug.apk manana-te-pago.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: manana-te-pago-apk
          path: manana-te-pago.apk

      - name: Publish/update "android-admin-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-admin-latest
          name: "Mañana Te Pago · Android (última versión)"
          body: |
            App "Mañana Te Pago": Cobros, Inventario y Caja de
            GIANNEXPRESS. Generada automáticamente desde `main`, no
            requiere Play Store y se conecta en tiempo real a la misma
            base de datos que la versión web.

            Instalación: descarga `manana-te-pago.apk`, ábrelo en el
            celular y permite "instalar apps de origen desconocido" si
            Android lo pide.
          prerelease: false
          make_latest: false
          files: manana-te-pago.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
